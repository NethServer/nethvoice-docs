name: Sync Documentation Translations

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - 'i18n/it/docusaurus-plugin-content-docs/current/**/*.md'
      - 'i18n/it/docusaurus-plugin-content-docs/current/**/*.mdx'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  issues: read
  metadata: read
  repository-projects: read
  statuses: read

jobs:
  sync-translations:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests PyYAML gitpython

      - name: Test GitHub Copilot API access
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Testing GitHub Models API connectivity..."
          python .github/scripts/translation-agent/test-copilot-access.py
          echo "✅ API test passed, proceeding with translation sync"

      - name: Get changed files and run translation sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the list of changed files between main branch (target) and current PR branch (source)
          git fetch origin main
          
          # Use three-dot notation for merge-base comparison
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD -- '*.md' '*.mdx' || true)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "✅ No documentation files changed between main and PR branch"
            exit 0
          fi
          
          echo "📝 Found changed files:"
          echo "$CHANGED_FILES"
          
          # Process all files sequentially (not in a subshell to preserve environment)
          for file in $CHANGED_FILES; do
            if [ -n "$file" ]; then
              echo "🔄 Processing: $file"
              python .github/scripts/translation-agent/translation-sync-agent.py "$file"
            fi
          done
          
          echo "✅ All files processed. Ready for commit check."
        continue-on-error: false

      - name: Check for changes and commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Translation Sync Bot"
          
          # Check if there are any changes to commit
          if git diff --quiet; then
            echo "✅ No translation changes needed"
          else
            # Show what files were modified
            echo "📝 Files with translation changes:"
            git diff --name-only
            
            # Add all changes and commit
            git add .
            
            # Count modified files for commit message
            MODIFIED_COUNT=$(git diff --cached --name-only | wc -l)
            
            git commit -m "docs: auto-sync translations for PR #${{ github.event.pull_request.number }}"
            
            git push
            echo "✅ Translation changes committed and pushed ($MODIFIED_COUNT files)"
          fi